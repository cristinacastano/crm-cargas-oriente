<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Logístico - Cargas del Oriente</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <i class="fas fa-truck-moving logo-icon"></i>
                <span class="logo-text">Cargas del Oriente</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-module="dashboard">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-module="fleet">
                <i class="fas fa-truck"></i>
                <span>Flota</span>
            </a>
            <a href="#" class="nav-item" data-module="fines">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Multas</span>
            </a>
            <a href="#" class="nav-item" data-module="clients">
                <i class="fas fa-building"></i>
                <span>Clientes</span>
            </a>
            <a href="#" class="nav-item" data-module="routes">
                <i class="fas fa-route"></i>
                <span>Rutas</span>
            </a>
            <a href="#" class="nav-item" data-module="scheduling">
                <i class="fas fa-calendar-alt"></i>
                <span>Programación</span>
            </a>
            <a href="#" class="nav-item" data-module="dispatch">
                <i class="fas fa-shipping-fast"></i>
                <span>Despacho</span>
            </a>
            <a href="#" class="nav-item" data-module="settlement">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Liquidación</span>
            </a>
            <a href="#" class="nav-item" data-module="config">
                <i class="fas fa-cog"></i>
                <span>Configuración</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">CA</div>
                <div class="user-details">
                    <span class="user-name">Cristina A.</span>
                    <span class="user-role">Administrador</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-title">
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div class="topbar-actions">
                <div class="company-selector">
                    <select id="companySelect">
                        <option>Cargas del Oriente S.A.</option>
                        <option>Operaciones Mineras S.A.S</option>
                    </select>
                </div>
                <button class="notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="badge">5</span>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area" id="contentArea">
            <!-- Modules will be loaded here by JS -->
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Título</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
                <button class="btn btn-primary" id="modalSave">Guardar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
