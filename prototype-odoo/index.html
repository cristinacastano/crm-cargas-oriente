<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargas del Oriente - Odoo CRM Log&iacute;stico</title>
    <link rel="stylesheet" href="odoo-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f0f0;">
        <div style="background:#fff;border-radius:8px;padding:40px 48px;box-shadow:0 4px 20px rgba(0,0,0,0.08);width:100%;max-width:420px;text-align:center;">
            <!-- Logo -->
            <div style="margin-bottom:20px;">
                <div style="width:60px;height:60px;margin:0 auto;background:radial-gradient(circle,#ff8c00 30%,#ff6600 70%);border-radius:50%;display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-sun" style="color:#fff;font-size:28px;"></i>
                </div>
            </div>
            <hr style="border:none;border-top:1px solid #e9ecef;margin-bottom:24px;">

            <!-- Form -->
            <div style="text-align:left;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <label style="font-weight:600;font-size:14px;color:#212529;">Email</label>
                    <a href="#" style="font-size:12px;color:#495057;text-decoration:none;">Elija un usuario</a>
                </div>
                <input id="loginEmail" type="email" value="admin@cargasdeloriente.com" style="width:100%;padding:10px 12px;border:1px solid #dee2e6;border-radius:4px;font-size:14px;font-family:'Roboto',sans-serif;margin-bottom:16px;">

                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <label style="font-weight:600;font-size:14px;color:#212529;">Password</label>
                    <a href="#" style="font-size:12px;color:#495057;text-decoration:none;">Reset Password</a>
                </div>
                <div style="position:relative;">
                    <input id="loginPassword" type="password" value="admin123" style="width:100%;padding:10px 12px;border:1px solid #dee2e6;border-radius:4px;font-size:14px;font-family:'Roboto',sans-serif;">
                    <i class="fas fa-eye" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#6c757d;cursor:pointer;" onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password';"></i>
                </div>

                <button onclick="doLogin()" style="width:100%;margin-top:20px;padding:12px;background:#7c5295;color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Roboto',sans-serif;transition:background 0.2s;">Log in</button>

                <p style="text-align:center;margin-top:14px;font-size:13px;color:#6c757d;">Don't have an account? <a href="#" style="color:#7c5295;text-decoration:none;">Sign up</a></p>

                <div style="text-align:center;margin-top:12px;color:#adb5bd;font-size:12px;">- or -</div>

                <button style="width:100%;margin-top:12px;padding:10px;background:#fff;border:1px solid #dee2e6;border-radius:4px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Roboto',sans-serif;color:#495057;">
                    <i class="fas fa-qrcode"></i> Use a Passkey
                </button>
            </div>

            <hr style="border:none;border-top:1px solid #e9ecef;margin-top:24px;">
            <div style="margin-top:12px;font-size:12px;color:#adb5bd;">
                <a href="#" style="color:#6c757d;text-decoration:none;">Manage Databases</a> | <span>Powered by Odoo</span>
            </div>
        </div>
    </div>

    <!-- APP (hidden until login) -->
    <div id="appContainer" style="display:none;">
    <!-- Odoo Top Navigation Bar -->
    <header class="o-navbar">
        <div class="o-navbar-left">
            <button class="o-home-btn" title="Inicio">
                <i class="fas fa-truck-moving"></i>
            </button>
            <span style="color:white;font-weight:700;font-size:14px;margin-right:12px;">Cargas del Oriente</span>
            <nav class="o-main-menu">
                <a href="#" class="o-menu-item active" data-menu="fleet">Flota y Mantenimiento</a>
                <a href="#" class="o-menu-item" data-menu="config">Configuración</a>
            </nav>
        </div>
        <div class="o-navbar-right">
            <div class="o-company-switch">
                <i class="fas fa-building"></i>
                <select id="companySwitch">
                    <option>Cargas del Oriente S.A.</option>
                    <option>Operaciones Mineras S.A.S</option>
                </select>
            </div>
            <button class="o-nav-btn" title="Actividades"><i class="fas fa-clock"></i></button>
            <button class="o-nav-btn" title="Conversaciones"><i class="fas fa-comments"></i><span class="o-badge">3</span></button>
            <div class="o-user-menu">
                <span class="o-avatar">CA</span>
            </div>
        </div>
    </header>

    <!-- Odoo Sub-navigation (module menus) -->
    <nav class="o-submenu" id="subMenu">
        <a href="#" class="o-submenu-item active" data-view="dashboard">Panel de control</a>
        <a href="#" class="o-submenu-item" data-view="vehicles">Vehículos</a>
        <a href="#" class="o-submenu-item" data-view="fines">Comparendos</a>
        <a href="#" class="o-submenu-item" data-view="clients">Clientes</a>
        <a href="#" class="o-submenu-item" data-view="routes">Rutas</a>
        <a href="#" class="o-submenu-item" data-view="scheduling">Programación</a>
        <a href="#" class="o-submenu-item" data-view="dispatch">Líneas de despacho</a>
        <a href="#" class="o-submenu-item" data-view="settlement">Liquidaciones</a>
    </nav>

    <!-- Main Content Area -->
    <main class="o-content" id="mainContent">
        <!-- Content loaded by JS -->
    </main>

    </div> <!-- end appContainer -->

    <!-- Modal / Form Dialog -->
    <div class="o-modal-overlay" id="modalOverlay">
        <div class="o-modal" id="modal">
            <div class="o-modal-header" id="modalHeader">
                <h3 id="modalTitle"></h3>
                <button class="o-modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="o-modal-body" id="modalBody"></div>
            <div class="o-modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script>
        function doLogin() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
        }
        // Allow Enter key to login
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
                doLogin();
            }
        });
    </script>
    <script src="municipios-dane.js" charset="utf-8"></script>
    <script src="odoo-app.js" charset="utf-8"></script>
</body>
</html>
